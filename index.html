 start to finish. If it needs moved, we’ll figure out how to move it."},{id:"more",label:"More",heading:"More",copy:"Custom work, problem-solving, seasonal work, cleanup, and the jobs that don't fit neatly into a category. If it needs to be built, fixed, moved, cleared, or figured out, we'll find a way to get it done."},{id:"services",label:"Services",heading:"Services",copy:"Repair Services: practical repairs and problem-solving for the things around your property that need fixing. Welding & Fabrication: reliable metal repair and custom fabrication built for real-world use. Small Engine Repair: diagnosis and repair for small engines and equipment that should be working harder than they are."},{id:"about",label:"About",heading:"About",copy:"Backwoods & Feral Co. is a hands-on, owner-operated business built around practical work, mechanical know-how, and getting the job done right. From property maintenance and repairs to welding, fabrication, equipment work, hauling, and other real-world projects, we believe in fixing what can be fixed, building things to last, and making good use of what we have. No big corporate operation. No passing the work down the line. Just real work by real people."},{id:"gallery",label:"Gallery",heading:"Gallery",copy:"Before-and-after shots of land cleared, loads hauled, and jobs done."},{id:"contact",label:"Contact",heading:"Contact",copy:"Angel: (850) 464-7767 — Call / Text. Grady: (863) 287-1707 — Call / Text. Email: Backwoodsferalco@gmail.com. Facebook: https://www.facebook.com/share/1MmzRYPyon/."}];function oi(){let[e,t]=Tt.useState(!1),[n,r]=Tt.useState(!1),[o,l]=Tt.useState(""),[A,i]=Tt.useState(null),a=Tt.useRef(null),p=ri.filter((g)=>g.label.toLowerCase().includes(o.trim().toLowerCase())),U=(g)=>{t(!1),r(!1),l(""),i(g),requestAnimationFrame(()=>{a.current?.scrollIntoView({behavior:"smooth",block:"start"})})},f=()=>{window.scrollTo({top:0,behavior:"smooth"})},K=()=>{t(!1),r(!1),l(""),i(null),window.scrollTo({top:0,behavior:"smooth"
